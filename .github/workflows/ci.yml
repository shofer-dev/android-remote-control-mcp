name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests with coverage
        run: ./gradlew :app:test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 14

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test-unit
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback). On
          # pull_request runs this reflects the ephemeral merge ref, not the post-merge
          # main commit; these artifacts are unsigned and never shipped.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs (gms + foss)
        run: ./gradlew assembleGmsDebug assembleFossDebug

      - name: Build release APKs (gms + foss)
        run: ./gradlew assembleGmsRelease assembleFossRelease

      - name: Upload gms debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-debug
          path: app/build/outputs/apk/gms/debug/app-gms-debug.apk
          retention-days: 30

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 30

      - name: Upload gms release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-release
          path: app/build/outputs/apk/gms/release/app-gms-release-unsigned.apk
          retention-days: 30

      - name: Upload foss release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-release
          path: app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          retention-days: 30
